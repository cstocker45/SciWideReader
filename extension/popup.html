<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --accent:#22a06b; --track:#d1d1d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e20; --fg:#f2f2f7; --muted:#98989f; --line:#38383c; --accent:#30c084; --track:#48484c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; width: 290px; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 12px; border-bottom:1px solid var(--line); }
  .title { font-weight:600; font-size:14px; }
  .host { color: var(--muted); font-size:11.5px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* switch */
  .switch { position:relative; width:40px; height:24px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:var(--track); border-radius:12px; cursor:pointer; transition:.15s; }
  .switch span::after { content:""; position:absolute; width:20px; height:20px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:disabled + span { opacity:.4; cursor:default; }
  section { padding: 12px 16px 4px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; font-weight:600; }
  .row { margin-bottom:14px; }
  .row-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size:12px; }
  .val button { border:0; background:none; color:var(--accent); cursor:pointer; padding:0 0 0 6px; font-size:12px; }
  input[type=range] { width:100%; accent-color: var(--accent); margin:0; }
  .row.default input[type=range] { opacity:.45; }
  .fonts { display:grid; grid-template-columns: repeat(5, 1fr); gap:4px; }
  .fonts button { border:1px solid var(--line); background:none; color:var(--fg); border-radius:6px; padding:6px 0 4px; cursor:pointer; font-size:16px; line-height:1.1; }
  .fonts button small { display:block; font: 9.5px -apple-system, sans-serif; color: var(--muted); margin-top:2px; }
  .fonts button.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  footer { display:flex; justify-content:space-between; align-items:center; padding:10px 16px 14px; border-top:1px solid var(--line); color:var(--muted); font-size:11.5px; }
  footer button { border:1px solid var(--line); background:none; color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
  kbd { font: 11px ui-monospace, monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .note { color:var(--muted); font-size:11.5px; padding: 0 16px 10px; display:none; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="title">Wide view</div>
      <div class="host" id="host">—</div>
    </div>
    <label class="switch"><input type="checkbox" id="site"><span></span></label>
  </header>
  <div class="note" id="note">Not available on this page.</div>

  <section>
    <h2>Typography <span style="text-transform:none;letter-spacing:0;font-weight:400">· all sites</span></h2>

    <div class="row">
      <div class="row-head"><span>Font</span></div>
      <div class="fonts" id="fonts">
        <button data-font="" title="Site default">Aa<small>Site</small></button>
        <button data-font="serif" style="font-family:Georgia,serif">Aa<small>Serif</small></button>
        <button data-font="book" style="font-family:'Iowan Old Style',Palatino,serif">Aa<small>Book</small></button>
        <button data-font="sans" style="font-family:-apple-system,'Helvetica Neue',sans-serif">Aa<small>Sans</small></button>
        <button data-font="verdana" style="font-family:Verdana,sans-serif">Aa<small>Wide</small></button>
      </div>
    </div>

    <div class="row" data-key="size">
      <div class="row-head"><span>Text size</span><span class="val"></span></div>
      <input type="range" min="12" max="28" step="1" data-default="17">
    </div>
    <div class="row" data-key="line">
      <div class="row-head"><span>Line spacing</span><span class="val"></span></div>
      <input type="range" min="1.1" max="2.4" step="0.05" data-default="1.6">
    </div>
    <div class="row" data-key="para">
      <div class="row-head"><span>Paragraph spacing</span><span class="val"></span></div>
      <input type="range" min="0" max="2.5" step="0.1" data-default="1">
    </div>
    <div class="row" data-key="width">
      <div class="row-head"><span>Text width</span><span class="val"></span></div>
      <input type="range" min="40" max="100" step="5" data-default="100">
    </div>
  </section>

  <footer>
    <span>Toggle: <kbd>Alt</kbd>+<kbd>W</kbd></span>
    <button id="reset">Reset</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
