<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b0d0c; --panel: #0e1110; --well: #080a09; --hover: rgba(45, 212, 178, 0.1);
    --line: #1a201e; --line-ctl: #232b28;
    --text: #c9d4cf; --text-hi: #eaf2ee; --muted: #8b9a93; --dim: #66736d; --faint: #4e5a55;
    --accent: oklch(0.8 0.11 168); --accent-on: #06100c; --warn: #d8a657;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --glow: 0 0 6px color-mix(in oklab, var(--accent) 55%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    width: 300px; color: var(--text); font: 12.5px/1.45 var(--mono);
    -webkit-font-smoothing: antialiased; position: relative;
  }
  /* faint CRT scanlines */
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  header { padding: 12px 14px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; justify-content: space-between; }
  .title { color: var(--text-hi); font-weight: 600; letter-spacing: 0.06em; }
  .title b { color: var(--accent); font-weight: 600; text-shadow: var(--glow); }
  .pulse { color: var(--dim); width: 1ch; display: inline-block; text-align: center; }
  .pulse[data-on] { color: var(--accent); text-shadow: var(--glow); }
  .host { color: var(--dim); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host::before { content: "> "; color: var(--faint); }

  /* [X] wide view */
  .site { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; user-select: none; }
  .site input { position: absolute; opacity: 0; pointer-events: none; }
  .site .box { color: var(--dim); white-space: pre; }
  .site .box::before { content: "[ ]"; }
  .site input:checked + .box { color: var(--accent); text-shadow: var(--glow); }
  .site input:checked + .box::before { content: "[X]"; }
  .site input:focus-visible + .box { outline: 1px solid var(--accent); outline-offset: 1px; }
  .site input:disabled ~ * { opacity: 0.4; cursor: default; }
  .site .state { color: var(--muted); }
  .site input:checked ~ .state { color: var(--text-hi); }
  .note { display: none; color: var(--warn); font-size: 11px; padding: 8px 14px 0; }

  section { padding: 12px 14px 4px; }
  h2 { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; font: 600 10.5px var(--mono);
       letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
  h2::before { content: "//"; color: var(--accent); }
  h2::after { content: ""; flex: 1; border-top: 1px dashed var(--line-ctl); }
  h2 small { font-weight: 400; letter-spacing: 0.04em; text-transform: none; color: var(--dim); order: 2; }

  .row { margin-bottom: 13px; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .label { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.08em; }
  .val { color: var(--accent); font-weight: 600; text-shadow: var(--glow); font-variant-numeric: tabular-nums; }
  .row.default .val { color: var(--dim); font-weight: 400; text-shadow: none; }
  .val button { color: var(--dim); margin-left: 6px; text-shadow: none; }
  .val button:hover { color: var(--accent); }

  /* ASCII slider: a real <input type=range> lies invisibly over the glyph bar */
  .slider { display: flex; align-items: center; gap: 2px; }
  .step { color: var(--dim); width: 2ch; height: 20px; text-align: center; border-radius: 3px; }
  .step:hover { color: var(--accent); text-shadow: var(--glow); background: var(--hover); }
  .track { position: relative; flex: 1; height: 20px; display: flex; align-items: center; justify-content: center;
           background: var(--well); border: 1px solid var(--line-ctl); border-radius: 3px; }
  .bar { white-space: pre; letter-spacing: -0.02em; pointer-events: none; color: var(--accent); text-shadow: var(--glow); }
  .bar .rest { color: var(--faint); text-shadow: none; }
  .bar .thumb { color: var(--text-hi); }
  .row.default .bar { color: var(--dim); text-shadow: none; }
  .row.default .bar .thumb { color: var(--muted); }
  .track input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .track:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--line-ctl)); }
  .track:has(input:focus-visible) { border-color: var(--accent); box-shadow: 0 0 8px color-mix(in oklab, var(--accent) 30%, transparent); }

  /* font picker: [Aa] cells, selected one bracketed in accent */
  .fonts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .fonts button { border: 1px solid var(--line-ctl); border-radius: 3px; padding: 5px 0 4px; font-size: 15px; line-height: 1.1;
                  color: var(--text); background: var(--well); }
  .fonts button small { display: block; font: 9px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin-top: 3px; }
  .fonts button:hover { background: var(--hover); }
  .fonts button.sel { border-color: var(--accent); color: var(--accent); text-shadow: var(--glow);
                      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent), 0 0 8px color-mix(in oklab, var(--accent) 20%, transparent); }
  .fonts button.sel small { color: var(--accent); }
  .fonts button.sel small::before { content: ">"; } .fonts button.sel small::after { content: "<"; }

  footer { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px 12px;
           border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 11px; }
  kbd { font: 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line-ctl); border-radius: 3px; padding: 0 4px; }
  #reset { color: var(--muted); border: 1px solid var(--line-ctl); border-radius: 3px; padding: 2px 8px; letter-spacing: 0.06em; }
  #reset:hover { color: var(--warn); border-color: var(--warn); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="title">WIDE<b>//</b>READER</span>
      <span class="pulse" id="pulse" aria-hidden="true">·</span>
    </div>
    <div class="host" id="host">—</div>
    <label class="site">
      <input type="checkbox" id="site">
      <span class="box" aria-hidden="true"></span>
      <span class="state">wide view on this site</span>
    </label>
  </header>
  <div class="note" id="note">!! not available on this page</div>

  <section>
    <h2>typography <small>all sites</small></h2>

    <div class="row">
      <div class="row-head"><span class="label">font</span></div>
      <div class="fonts" id="fonts">
        <button data-font="" title="Site default">Aa<small>site</small></button>
        <button data-font="serif" style="font-family:Georgia,serif">Aa<small>serif</small></button>
        <button data-font="book" style="font-family:'Iowan Old Style',Palatino,serif">Aa<small>book</small></button>
        <button data-font="sans" style="font-family:-apple-system,'Helvetica Neue',sans-serif">Aa<small>sans</small></button>
        <button data-font="verdana" style="font-family:Verdana,sans-serif">Aa<small>wide</small></button>
      </div>
    </div>

    <div class="row" data-key="size">
      <div class="row-head"><span class="label">text size</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Smaller">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="12" max="28" step="1" data-default="17" aria-label="Text size"></div>
        <button class="step" data-dir="1" aria-label="Larger">▸</button></div>
    </div>
    <div class="row" data-key="line">
      <div class="row-head"><span class="label">line spacing</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Tighter">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="1.1" max="2.4" step="0.05" data-default="1.6" aria-label="Line spacing"></div>
        <button class="step" data-dir="1" aria-label="Looser">▸</button></div>
    </div>
    <div class="row" data-key="para">
      <div class="row-head"><span class="label">paragraph gap</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Less">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="0" max="2.5" step="0.1" data-default="1" aria-label="Paragraph spacing"></div>
        <button class="step" data-dir="1" aria-label="More">▸</button></div>
    </div>
    <div class="row" data-key="width">
      <div class="row-head"><span class="label">text width</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Narrower">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="40" max="100" step="5" data-default="100" aria-label="Text width"></div>
        <button class="step" data-dir="1" aria-label="Wider">▸</button></div>
    </div>
  </section>

  <footer>
    <span><kbd>ALT</kbd>+<kbd>W</kbd> toggle</span>
    <button id="reset">[ RESET ]</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
