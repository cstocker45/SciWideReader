<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Clean, quiet, mono. One accent for state and values; follows the browser's
     light/dark setting. ASCII is used for the controls, not as decoration. */
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #f7f8f7; --well: #f3f4f3; --hover: rgba(15, 140, 110, 0.07);
    --line: #e6e8e7; --line-ctl: #d9dddb;
    --text: #2b302e; --text-hi: #111413; --muted: #66706c; --dim: #8b9590; --faint: #b3bab7;
    --accent: #0f8c6e; --warn: #b5762a;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a19; --panel: #1b201e; --well: #121514; --hover: rgba(45, 212, 178, 0.08);
      --line: #262c2a; --line-ctl: #313835;
      --text: #c9d4cf; --text-hi: #eaf2ee; --muted: #8b9a93; --dim: #6b7873; --faint: #46504c;
      --accent: #4cc9a8; --warn: #d8a657;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { width: 300px; color: var(--text); font: 12px/1.45 var(--mono); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; justify-content: space-between; }
  .title { color: var(--text-hi); font-weight: 600; }
  .title b { color: var(--accent); font-weight: 600; }
  .pulse { color: var(--faint); font-size: 10px; }
  .pulse[data-on] { color: var(--accent); }
  .host { color: var(--dim); font-size: 11px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* [x] wide view on this site */
  .site { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; user-select: none; }
  .site input { position: absolute; opacity: 0; pointer-events: none; }
  .site .box { color: var(--dim); white-space: pre; }
  .site .box::before { content: "[ ]"; }
  .site input:checked + .box { color: var(--accent); }
  .site input:checked + .box::before { content: "[x]"; }
  .site input:focus-visible + .box { outline: 1px solid var(--accent); outline-offset: 1px; }
  .site input:disabled ~ * { opacity: 0.45; cursor: default; }
  .site .state { color: var(--text); }
  .note { display: none; color: var(--warn); font-size: 11px; padding: 8px 14px 0; }

  section { padding: 12px 14px 2px; }
  h2 { display: flex; justify-content: space-between; margin: 0 0 10px; font: 500 11px var(--mono); color: var(--muted); }
  h2 small { font-weight: 400; color: var(--dim); }

  .row { margin-bottom: 12px; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .label { color: var(--muted); font-size: 11px; }
  .val { color: var(--text-hi); font-variant-numeric: tabular-nums; }
  .row.default .val { color: var(--dim); }
  .val button { color: var(--dim); margin-left: 6px; }
  .val button:hover { color: var(--accent); }

  /* ASCII slider: a real <input type=range> lies invisibly over the glyph bar */
  .slider { display: flex; align-items: center; gap: 2px; }
  .step { color: var(--dim); width: 2ch; height: 20px; text-align: center; border-radius: 3px; }
  .step:hover { color: var(--text-hi); background: var(--hover); }
  .track { position: relative; flex: 1; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; }
  .track:hover { background: var(--hover); }
  .bar { white-space: pre; pointer-events: none; color: var(--accent); }
  .bar .rest { color: var(--faint); }
  .bar .thumb { color: var(--accent); }
  .row.default .bar, .row.default .bar .thumb { color: var(--dim); }
  .track input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .track:has(input:focus-visible) { outline: 1px solid var(--accent); }

  .fonts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .fonts button { border: 1px solid var(--line-ctl); border-radius: 4px; padding: 5px 0 4px; font-size: 15px; line-height: 1.1; color: var(--text); }
  .fonts button small { display: block; font: 9.5px var(--mono); color: var(--dim); margin-top: 2px; }
  .fonts button:hover { background: var(--hover); }
  .fonts button.sel { border-color: var(--accent); color: var(--accent); }
  .fonts button.sel small { color: var(--accent); }

  footer { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px 11px;
           border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  kbd { font: 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line-ctl); border-radius: 3px; padding: 0 4px; }
  #reset { color: var(--muted); border: 1px solid var(--line-ctl); border-radius: 4px; padding: 2px 8px; }
  #reset:hover { color: var(--text-hi); background: var(--hover); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="title"><b>Sci</b>WideReader</span>
      <span class="pulse" id="pulse" aria-hidden="true">·</span>
    </div>
    <div class="host" id="host">—</div>
    <label class="site">
      <input type="checkbox" id="site">
      <span class="box" aria-hidden="true"></span>
      <span class="state">wide view on this site</span>
    </label>
  </header>
  <div class="note" id="note">Not available on this page.</div>

  <section>
    <h2>typography <small>all sites</small></h2>

    <div class="row">
      <div class="row-head"><span class="label">font</span></div>
      <div class="fonts" id="fonts">
        <button data-font="" title="Site default">Aa<small>site</small></button>
        <button data-font="serif" style="font-family:Georgia,serif">Aa<small>serif</small></button>
        <button data-font="book" style="font-family:'Iowan Old Style',Palatino,serif">Aa<small>book</small></button>
        <button data-font="sans" style="font-family:-apple-system,'Helvetica Neue',sans-serif">Aa<small>sans</small></button>
        <button data-font="verdana" style="font-family:Verdana,sans-serif">Aa<small>wide</small></button>
      </div>
    </div>

    <div class="row" data-key="size">
      <div class="row-head"><span class="label">text size</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Smaller">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="12" max="28" step="1" data-default="17" aria-label="Text size"></div>
        <button class="step" data-dir="1" aria-label="Larger">▸</button></div>
    </div>
    <div class="row" data-key="line">
      <div class="row-head"><span class="label">line spacing</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Tighter">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="1.1" max="2.4" step="0.05" data-default="1.6" aria-label="Line spacing"></div>
        <button class="step" data-dir="1" aria-label="Looser">▸</button></div>
    </div>
    <div class="row" data-key="para">
      <div class="row-head"><span class="label">paragraph gap</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Less">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="0" max="2.5" step="0.1" data-default="1" aria-label="Paragraph spacing"></div>
        <button class="step" data-dir="1" aria-label="More">▸</button></div>
    </div>
    <div class="row" data-key="width">
      <div class="row-head"><span class="label">text width</span><span class="val"></span></div>
      <div class="slider"><button class="step" data-dir="-1" aria-label="Narrower">◂</button>
        <div class="track"><span class="bar"></span><input type="range" min="40" max="100" step="5" data-default="100" aria-label="Text width"></div>
        <button class="step" data-dir="1" aria-label="Wider">▸</button></div>
    </div>
  </section>

  <footer>
    <span><kbd>ALT</kbd>+<kbd>W</kbd> toggle</span>
    <button id="reset">reset</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
